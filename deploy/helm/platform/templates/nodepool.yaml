apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        role: gpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: {{ toJson .Values.gpuInstanceTypes }}
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.gpuCapacityTypes }}
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      expireAfter: 24h
  limits:
    nvidia.com/gpu: {{ .Values.gpuLimit }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: {{ .Values.consolidateAfter }}
