apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: {{ required "nodeRole is required" .Values.nodeRole }}
  amiSelectorTerms:
    - alias: {{ .Values.amiAlias }}   # Karpenter picks the NVIDIA variant for GPU instance types
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName }}
  associatePublicIPAddress: true      # public subnets, no NAT gateway
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1        # pods use pod identity, not the node's IMDS role
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ .Values.gpuRootVolumeSize }}
        volumeType: gp3
        throughput: 250
        encrypted: true
        deleteOnTermination: true
  {{- with .Values.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
