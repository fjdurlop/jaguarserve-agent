[project]
name = "jaguarserve-agent"
version = "0.1.0"
description = "Minimal grounded chatbot agent: catalog retrieval, pricing, availability, appointments and allow-listed web search over a self-hosted LLM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "prometheus-client>=0.21",
    "tzdata>=2024.1",
    "redis>=5.2",
]

[project.optional-dependencies]
# CPU embedding model (ONNX). Without it the app uses the deterministic "hash" embedder.
embed = ["fastembed>=0.4"]
# Extra parsers for real catalogs (PDF spec sheets, XLSX price lists).
docs = ["pypdf>=5.0", "openpyxl>=3.1"]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "ingest", "eval"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"eval/**" = ["S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["pg: needs TEST_DATABASE_URL (Postgres with pgvector)"]
